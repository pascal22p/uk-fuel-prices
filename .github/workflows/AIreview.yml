name: Scala AI Code Review

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: ScalaSemantic + OVH Review
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Get the PR associated with the completed build
      # ------------------------------------------------------------

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          PR_JSON=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/pulls")

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          echo "PR #$PR_NUMBER"

      # ------------------------------------------------------------
      # Checkout EXACT commit that was built
      # ------------------------------------------------------------

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # Get base SHA
      # ------------------------------------------------------------

      - name: Get PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          BASE_SHA=$(gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.base.sha')

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

      # ------------------------------------------------------------
      # Download SemanticDB from the BUILD workflow
      #
      # The build workflow must upload an artifact called:
      #
      #     semanticdb
      #
      # ------------------------------------------------------------

      - name: Download SemanticDB
        uses: actions/download-artifact@v4
        with:
          name: semanticdb
          path: semanticdb
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Show SemanticDB
        run: |
          echo "SemanticDB files:"

          find semanticdb \
            -type f \
            -name "*.semanticdb" \
            -print || true

      # ------------------------------------------------------------
      # Get changed files
      # ------------------------------------------------------------

      - name: Get changed files
        run: |
          git diff \
            --name-only \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      # ------------------------------------------------------------
      # Capture COMPLETE BEFORE and AFTER versions
      # ------------------------------------------------------------

      - name: Capture complete source files
        run: |
          rm -rf review-context

          mkdir -p review-context/before
          mkdir -p review-context/after

          while IFS= read -r file; do

            [ -z "$file" ] && continue

            # Only send Scala source to the reviewer.
            if [[ "$file" != *.scala ]]; then
              continue
            fi

            # Keep the original path in the filename.
            safe_name=$(echo "$file" | sed 's#[/ ]#__#g')

            echo "Capturing: $file"

            # -------------------------
            # BEFORE
            # -------------------------

            if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then

              git show \
                "$BASE_SHA:$file" \
                > "review-context/before/${safe_name}"

            else

              echo "[FILE DID NOT EXIST AT BASE]" \
                > "review-context/before/${safe_name}"

            fi

            # -------------------------
            # AFTER
            # -------------------------

            if git cat-file -e "$HEAD_SHA:$file" 2>/dev/null; then

              git show \
                "$HEAD_SHA:$file" \
                > "review-context/after/${safe_name}"

            else

              echo "[FILE DELETED BY PR]" \
                > "review-context/after/${safe_name}"

            fi

          done < changed-files.txt

      # ------------------------------------------------------------
      # Generate COMPLETE diff
      # ------------------------------------------------------------

      - name: Generate PR diff
        run: |
          git diff \
            --find-renames \
            --find-copies \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            -- '*.scala' \
            > review-context/pr.diff

      # ------------------------------------------------------------
      # Extract useful SemanticDB information
      #
      # We don't send raw SemanticDB binary files to the LLM.
      #
      # We create a manifest so the model knows semantic information
      # is available and which source areas have semantic data.
      # ------------------------------------------------------------

      - name: Build semantic context
        run: |
          python3 <<'PY'
          from pathlib import Path

          output = Path(
              "review-context/semantic-context.md"
          )

          semanticdb = Path("semanticdb")

          files = sorted(
              semanticdb.rglob("*.semanticdb")
          ) if semanticdb.exists() else []

          with output.open(
              "w",
              encoding="utf-8"
          ) as out:

              out.write(
                  "# SCALA SEMANTIC INFORMATION\n\n"
              )

              if not files:
                  out.write(
                      "No SemanticDB files were found.\n\n"
                  )

                  out.write(
                      "The reviewer must rely on the "
                      "complete source and diff.\n"
                  )

              else:

                  out.write(
                      f"SemanticDB files available: "
                      f"{len(files)}\n\n"
                  )

                  for file in files:
                      out.write(
                          f"- `{file}`\n"
                      )

                  out.write(
                      "\nSemanticDB was generated by the "
                      "existing Scala build workflow.\n"
                  )

                  out.write(
                      "\nDo not assume that textual symbol "
                      "names are equivalent when resolving "
                      "Scala references.\n"
                  )

          print(
              output.read_text(
                  encoding="utf-8"
              )
          )
          PY

      # ------------------------------------------------------------
      # Build COMPLETE AI context
      # ------------------------------------------------------------

      - name: Build AI review context
        run: |
          python3 <<'PY'
          from pathlib import Path


          output = Path(
              "review-context/full-context.md"
          )


          with output.open(
              "w",
              encoding="utf-8"
          ) as out:

              # ==================================================
              # SEMANTIC INFORMATION
              # ==================================================

              out.write(
                  "# 1. SCALA SEMANTIC INFORMATION\n\n"
              )

              semantic = Path(
                  "review-context/semantic-context.md"
              )

              if semantic.exists():

                  out.write(
                      semantic.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  )

              out.write("\n\n")


              # ==================================================
              # CHANGED FILES
              # ==================================================

              out.write(
                  "# 2. CHANGED FILES\n\n"
              )

              changed = Path(
                  "changed-files.txt"
              )

              out.write(
                  changed.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              )

              out.write("\n\n")


              # ==================================================
              # COMPLETE BEFORE
              # ==================================================

              out.write(
                  "# 3. COMPLETE SOURCE BEFORE PR\n\n"
              )

              before = Path(
                  "review-context/before"
              )

              for file in sorted(
                  before.iterdir()
              ):

                  out.write(
                      f"## {file.name}\n\n"
                  )

                  out.write(
                      "```scala\n"
                  )

                  out.write(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )


              # ==================================================
              # COMPLETE AFTER
              # ==================================================

              out.write(
                  "# 4. COMPLETE SOURCE AFTER PR\n\n"
              )

              after = Path(
                  "review-context/after"
              )

              for file in sorted(
                  after.iterdir()
              ):

                  out.write(
                      f"## {file.name}\n\n"
                  )

                  out.write(
                      "```scala\n"
                  )

                  out.write(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )


              # ==================================================
              # COMPLETE DIFF
              # ==================================================

              out.write(
                  "# 5. COMPLETE PR DIFF\n\n"
              )

              diff = Path(
                  "review-context/pr.diff"
              )

              out.write(
                  "```diff\n"
              )

              out.write(
                  diff.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              )

              out.write(
                  "\n```\n\n"
              )


          size = output.stat().st_size

          print(
              f"Review context size: {size:,} bytes"
          )
          PY

      # ------------------------------------------------------------
      # Install OpenAI-compatible client
      # ------------------------------------------------------------

      - name: Install OpenAI client
        run: |
          python3 -m pip install --quiet openai

      # ------------------------------------------------------------
      # OVH REVIEW
      # ------------------------------------------------------------

      - name: Review with OVH
        env:
          OVH_AI_ENDPOINTS_API_KEY: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os

          from pathlib import Path

          from openai import OpenAI


          context = Path(
              "review-context/full-context.md"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          )


          client = OpenAI(
              base_url=(
                  "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
              ),
              api_key=os.environ[
                  "OVH_AI_ENDPOINTS_API_KEY"
              ],
          )


          SYSTEM = """
          You are a senior Scala 3 engineer performing
          a production-grade GitHub pull request review.

          You have the following information:

          1. SemanticDB information generated by the project's
             existing Scala build, when available.
          2. Every changed Scala file BEFORE the PR.
          3. Every changed Scala file AFTER the PR.
          4. The complete PR diff.

          IMPORTANT:

          Do NOT review the diff in isolation.

          First understand the complete BEFORE implementation.

          Then understand the complete AFTER implementation.

          Then determine exactly what changed.

          Use semantic information when available to reason about:

          - symbols
          - references
          - method signatures
          - class hierarchy
          - inheritance
          - method calls
          - usages
          - implicit/given resolution
          - type relationships

          Scala 3-specific review:

          - given / using
          - implicit resolution
          - extension methods
          - type inference
          - union types
          - intersection types
          - opaque types
          - match types
          - typeclasses
          - variance
          - pattern matching
          - exhaustive matches
          - Option
          - Either
          - Try
          - Future
          - ExecutionContext
          - concurrency
          - mutable state
          - lazy evaluation
          - collections
          - resource management
          - exception handling

          If the project uses:

          - Cats
          - Cats Effect
          - ZIO
          - Akka
          - Pekko

          reason about their actual semantics.

          Also inspect for:

          - security vulnerabilities
          - authentication problems
          - authorization problems
          - data corruption
          - incorrect transactions
          - database bugs
          - serialization issues
          - API compatibility
          - binary compatibility
          - performance regressions
          - resource leaks
          - concurrency bugs
          - error handling bugs
          - architectural regressions

          Only report issues that are:

          1. Introduced by this PR.
          2. Demonstrably problematic.
          3. Actionable.
          4. Significant enough to fix.

          Do NOT report:

          - formatting
          - naming preferences
          - subjective style
          - harmless refactoring
          - pre-existing bugs
          - speculative concerns

          Every finding MUST correspond to a line changed
          by the PR.

          Severity:

          CRITICAL:
            Severe security, data loss, or production issue.

          HIGH:
            Significant bug, outage risk, or serious regression.

          MEDIUM:
            Real bug or meaningful reliability/performance issue.

          LOW:
            Legitimate but minor issue.

          Return ONLY valid JSON.

          Required schema:

          {
            "summary": "Short overall assessment",
            "risk": "LOW|MEDIUM|HIGH|CRITICAL",
            "findings": [
              {
                "file": "src/main/scala/foo/Bar.scala",
                "line": 123,
                "severity": "CRITICAL|HIGH|MEDIUM|LOW",
                "title": "Short issue title",
                "body": "Clear explanation of the problem, impact, and fix."
              }
            ]
          }

          If there are no meaningful issues:

          {
            "summary": "No significant issues found.",
            "risk": "LOW",
            "findings": []
          }
          """


          response = client.chat.completions.create(
              model="gpt-oss-120b",
              messages=[
                  {
                      "role": "system",
                      "content": SYSTEM,
                  },
                  {
                      "role": "user",
                      "content": context,
                  },
              ],
              temperature=0,
              reasoning_effort="high",
              max_tokens=10000,
              response_format={
                  "type": "json_object"
              },
          )


          raw = response.choices[0].message.content


          try:
              review = json.loads(raw)

          except Exception:

              print(raw)

              raise SystemExit(
                  "OVH returned invalid JSON"
              )


          Path(
              "review-context/review.json"
          ).write_text(
              json.dumps(
                  review,
                  indent=2
              ),
              encoding="utf-8"
          )


          print(
              json.dumps(
                  review,
                  indent=2
              )
          )
          PY

      # ------------------------------------------------------------
      # Publish GitHub inline review
      # ------------------------------------------------------------

      - name: Publish GitHub review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          from pathlib import Path


          repo = os.environ["REPOSITORY"]
          pr = os.environ["PR_NUMBER"]

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]


          def run(command):

              result = subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:

                  print(result.stderr)

                  raise SystemExit(
                      result.returncode
                  )

              return result.stdout


          review = json.loads(
              Path(
                  "review-context/review.json"
              ).read_text()
          )


          findings = review.get(
              "findings",
              []
          )


          # --------------------------------------------------------
          # Get exact PR diff
          # --------------------------------------------------------

          diff = run([
              "git",
              "diff",
              "--find-renames",
              "--find-copies",
              base,
              head,
              "--",
              "*.scala",
          ])


          # --------------------------------------------------------
          # Convert file + new line into GitHub diff position
          # --------------------------------------------------------

          positions = {}

          current_file = None
          new_line = None
          position = 0


          for line in diff.splitlines():

              position += 1


              if line.startswith("+++ b/"):

                  current_file = line[6:]

                  continue


              if line.startswith("@@"):

                  match = re.search(
                      r"\+(\d+)(?:,(\d+))?",
                      line
                  )

                  if match:

                      new_line = int(
                          match.group(1)
                      )

                  continue


              if (
                  current_file is None
                  or new_line is None
              ):
                  continue


              # Added line
              if (
                  line.startswith("+")
                  and not line.startswith("+++")
              ):

                  positions[
                      (current_file, new_line)
                  ] = position

                  new_line += 1

                  continue


              # Context line
              if (
                  not line.startswith("-")
                  and not line.startswith("---")
              ):

                  new_line += 1


          comments = []


          for finding in findings:

              file = finding.get("file")
              line = finding.get("line")

              if not file or not line:
                  continue


              try:
                  line = int(line)
              except Exception:
                  continue


              position = positions.get(
                  (file, line)
              )


              if position is None:

                  print(
                      f"Could not map finding "
                      f"to changed line: "
                      f"{file}:{line}"
                  )

                  continue


              severity = finding.get(
                  "severity",
                  "MEDIUM"
              )

              title = finding.get(
                  "title",
                  "Code review finding"
              )

              body = finding.get(
                  "body",
                  ""
              )


              comments.append({
                  "path": file,
                  "position": position,
                  "body": (
                      f"**{severity} — {title}**\n\n"
                      f"{body}\n\n"
                      "_ScalaSemantic/SemanticDB + "
                      "OVH gpt-oss-120b_"
                  )
              })


          # GitHub limits review payloads.
          comments = comments[:50]


          summary = review.get(
              "summary",
              "AI code review completed."
          )

          risk = review.get(
              "risk",
              "LOW"
          )


          review_body = (
              "## 🤖 Scala AI Code Review\n\n"
              f"**Risk:** `{risk}`\n\n"
              f"{summary}\n\n"
              "Review context:\n"
              "- Scala 3 SemanticDB from build\n"
              "- Complete BEFORE source\n"
              "- Complete AFTER source\n"
              "- Complete PR diff\n"
              "- OVH `gpt-oss-120b`\n"
          )


          payload = {
              "body": review_body,
              "event": "COMMENT",
              "comments": comments,
          }


          result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{repo}/pulls/{pr}/reviews",
                  "--method",
                  "POST",
                  "--input",
                  "-",
              ],
              input=json.dumps(payload),
              text=True,
              capture_output=True
          )


          if result.returncode != 0:

              print(result.stderr)

              raise SystemExit(
                  result.returncode
              )


          print(
              f"Published {len(comments)} "
              "inline review comments."
          )
          PY

      # ------------------------------------------------------------
      # Keep review context for debugging
      # ------------------------------------------------------------

      - name: Upload review context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scala-ai-review
          path: |
            changed-files.txt
            review-context/
          retention-days: 7
          
